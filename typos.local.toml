# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Inline code spans were masked by the previous dictionary snapshot; kept
  # until the shared dictionary rules on it.
  '`[^`\n]+`',
  # External environment variables retain their published spelling.
  '\bNO_COLOR\b',
  '\bCARGO_TERM_COLOR\b',
  # CSS properties and values retain the spelling required by browsers.
  '\b(?:border-)?color\s*:',
  '\b(?:align-items|justify-content|text-align|place-items)\s*:\s*center\b',
  '\bscroll-behavior\s*:',
]

[files]
exclude = []
