[project]
name = "ishiban"
version = "0.1.0"
description = "ishiban package"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "ISC" }
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "cyclopts>=4.25.2",
    "falcon>=4,<5",
    "itsdangerous>=2.2,<3",
    "msgspec>=0.22.0",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ishiban = "ishiban.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "interrogate",
    "pip-audit",
    "ruff==0.16.8",
    "cyclopts==4.25.2",
    "pyyaml==6.0.3",
    "types-pyyaml",
    "pyright",
    "ty==0.0.56",
    "pytest-timeout",
    "pytest-xdist",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-bdd>=9.0.1",
    "hypothesis>=6.170.15",
    "syrupy>=6.1.1",
    "cmd-mox==0.2.0",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "ASYNC",
    "D",
    "DOC",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["RUF067"]
"**/test_*.py" = ["S101", "PLR0913", "PLR0917", "PLR2004", "PLR6301"]
"tests/steps/*.py" = ["S101", "PLR0913", "PLR0917", "PLR2004", "PLR6301"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.AbstractSet".msg = "Use collections.abc.Set instead of deprecated typing generics."
"typing.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead of deprecated typing generics."
"typing.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead of deprecated typing generics."
"typing.AsyncIterable".msg = "Use collections.abc.AsyncIterable instead of deprecated typing generics."
"typing.AsyncIterator".msg = "Use collections.abc.AsyncIterator instead of deprecated typing generics."
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead of deprecated typing generics."
"typing.Callable".msg = "Use collections.abc.Callable instead of deprecated typing generics."
"typing.ChainMap".msg = "Use collections.ChainMap instead of deprecated typing generics."
"typing.Collection".msg = "Use collections.abc.Collection instead of deprecated typing generics."
"typing.Container".msg = "Use collections.abc.Container instead of deprecated typing generics."
"typing.ContextManager".msg = "Use contextlib.AbstractContextManager instead of deprecated typing generics."
"typing.Coroutine".msg = "Use collections.abc.Coroutine instead of deprecated typing generics."
"typing.Counter".msg = "Use collections.Counter instead of deprecated typing generics."
"typing.DefaultDict".msg = "Use collections.defaultdict instead of deprecated typing generics."
"typing.Deque".msg = "Use collections.deque instead of deprecated typing generics."
"typing.Dict".msg = "Use dict instead of deprecated typing generics."
"typing.FrozenSet".msg = "Use frozenset instead of deprecated typing generics."
"typing.Generator".msg = "Use collections.abc.Generator instead of deprecated typing generics."
"typing.ItemsView".msg = "Use collections.abc.ItemsView instead of deprecated typing generics."
"typing.Iterable".msg = "Use collections.abc.Iterable instead of deprecated typing generics."
"typing.Iterator".msg = "Use collections.abc.Iterator instead of deprecated typing generics."
"typing.KeysView".msg = "Use collections.abc.KeysView instead of deprecated typing generics."
"typing.List".msg = "Use list instead of deprecated typing generics."
"typing.Mapping".msg = "Use collections.abc.Mapping instead of deprecated typing generics."
"typing.Match".msg = "Use re.Match instead of deprecated typing generics."
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead of deprecated typing generics."
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead of deprecated typing generics."
"typing.MutableSet".msg = "Use collections.abc.MutableSet instead of deprecated typing generics."
"typing.OrderedDict".msg = "Use collections.OrderedDict instead of deprecated typing generics."
"typing.Pattern".msg = "Use re.Pattern instead of deprecated typing generics."
"typing.Reversible".msg = "Use collections.abc.Reversible instead of deprecated typing generics."
"typing.Sequence".msg = "Use collections.abc.Sequence instead of deprecated typing generics."
"typing.Set".msg = "Use set instead of deprecated typing generics."
"typing.Tuple".msg = "Use tuple instead of deprecated typing generics."
"typing.Type".msg = "Use type instead of deprecated typing generics."
"typing.ValuesView".msg = "Use collections.abc.ValuesView instead of deprecated typing generics."

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pylint.main]
py-version = "3.14"
recursive = true
max-module-lines = 400

[tool.pylint.design]
max-args = 4
max-locals = 20
max-statements = 70
max-positional-arguments = 4

[tool.pylint."messages control"]
disable = [
    "all",
]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

# Scan the checkout so scripts and Python action implementations cannot fall
# outside the gate. Runtime entry points remain distinct from exceptions.
[tool.df12_skylos]
roots = ["."]
python = "3.14"

[tool.skylos]
exclude = [".venv", ".uv-cache", ".uv-tools", ".tools", ".git"]

[tool.skylos.gate]
strict = true

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["ishiban.api.Lifecycle.process_startup", "ishiban.api.Lifecycle.process_shutdown", "ishiban.api.Lifecycle.process_response"]
reason = "Falcon invokes registered middleware methods dynamically at ASGI startup, shutdown, and response completion."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["ishiban.interface_state.InterfaceStateCookies.read", "ishiban.interface_state.InterfaceStateCookies._set_cookie"]
reason = "SnapshotResource.on_get and InterfaceStateResource.on_get/on_post call these signer methods through injected cookie objects; Skylos does not propagate this Falcon dispatch path."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = ["ishiban.interface_state._state_mapping"]
reason = "InterfaceStateResource.on_post reads bounded bodies and maps validated state; on_get and the signer also map state. Skylos does not propagate reachability through these Falcon handlers."



[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = ["ishiban.request_body.read_bounded_body", "ishiban.bounded_batch.prepare_batch", "ishiban.bounded_batch.decode_session_ids", "ishiban.session_identity.is_safe_session_id"]
reason = "The activity and recency Falcon handlers invoke shared bounded request decoding and exact-ID validation; Skylos does not propagate these handler and generator paths."

[[tool.skylos.dead_code.entrypoints]]
type = "class"
full_name = ["ishiban.bounded_batch._BatchRequest"]
reason = "Shared bounded request decoding passes this typed shape to msgspec.json.decode for both Falcon batch handlers; Skylos does not follow that decoder reachability."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = ["ishiban.inspector_api._existing_session", "ishiban.inspector_api._set_scoped_detail"]
reason = "The registered agent and PR Falcon on_get handlers call these current-session lookup and scoped-response helpers; Skylos does not propagate dynamic resource dispatch."

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = ["ishiban.session_recency_api.SessionRecencyResource._stream_results", "ishiban.session_recency_api.SessionRecencyResource._resolve_one"]
reason = "Falcon consumes the recency response async generator, which registers its per-member resolver with bounded_batch.start_results; Skylos does not follow the response stream and callback ownership paths."

[tool.nose]
version = "0.20.0"
roots = ["."]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 0
exclude = [".venv/**", ".uv-cache/**", ".uv-tools/**", ".tools/**", ".git/**"]

# Skylos treats test-classified paths as entry points, so Vulture supplies
# dead-helper detection there. Names collected by pytest are entry points;
# their function bodies and all other definitions remain checked.
[tool.vulture]
ignore_names = ["test_*", "pytestmark", "pytest_plugins"]
# pytest-bdd discovers step implementations through their decorators.
ignore_decorators = ["@given", "@when", "@then"]
min_confidence = 60

[tool.mutmut]
# mutmut copies the tree before running the suite: tests that read
# repository-root paths outside tests/ must either add those paths to
# `also_copy` or guard themselves with a skipif. See the shared-actions
# caller guide (docs/mutation-mutmut-workflow.md).
source_paths = ["ishiban/"]
also_copy = ["scripts/", ".github/", "Makefile", "pyproject.toml"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pytest.ini_options]
# Bun owns .snap files; Syrupy owns Python .ambr snapshots.
addopts = "--snapshot-ignore-file-extensions=snap"
asyncio_default_fixture_loop_scope = "function"
# Tests automatically killed after seconds elapsed
timeout = 30
testpaths = ["tests"]

[tool.uv]
package = true


[[tool.duplication_gate.allow]]
unit = "tools/oxlint-plugin-df12/jsdoc.js"
reason = "Preserve imported visibility-specific AST visitors and distinct missing-documentation diagnostics; see docs/adr-001-typescript-tooling.md#duplication-review"
[[tool.duplication_gate.allow]]
members = ["tools/oxlint-plugin-df12/complex-conditional.js::DoWhileStatement", "tools/oxlint-plugin-df12/complex-conditional.js::ForStatement", "tools/oxlint-plugin-df12/complex-conditional.js::IfStatement", "tools/oxlint-plugin-df12/complex-conditional.js::WhileStatement"]
reason = "Keep explicit ESTree visitor names in the imported rule; each delegates to the same predicate checker. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
members = ["tools/oxlint-plugin-df12/complex-conditional.js::checkPredicate", "tools/oxlint-plugin-df12/complex-conditional.js::complexConditionalOptions"]
reason = "Keep option normalization separate from diagnostic reporting; structural subgraph similarity is not duplicated behaviour. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
members = ["tests/oxlint-complexity.test.js::isSyntheticAstNode", "tools/oxlint-plugin-df12/jsdoc-helpers.js::isAstNode"]
reason = "Keep the property-test oracle independent from the implementation it verifies. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
members = ["tools/oxlint-plugin-df12/complex-conditional.js::countPredicateOperators", "tools/oxlint-plugin-df12/complex-conditional.js::predicateNodeCount"]
reason = "Keep recursive traversal separate from counting one node; the similar subgraph represents different responsibilities. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
members = ["tools/oxlint-plugin-df12/jsdoc-helpers.js::isPromiseObject", "tools/oxlint-plugin-df12/jsdoc-helpers.js::isRejectProperty"]
reason = "Keep separate named predicates for the object and property halves of Promise.reject AST recognition. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
unit = "reference/ishiban-mockup.html"
reason = "Preserve the supplied mockup stylesheet and its denser panorama overrides as reference material. See docs/adr-001-typescript-tooling.md#duplication-review."
[[tool.duplication_gate.allow]]
unit = "tools/oxlint-plugin-df12/jsdoc-helpers.js"
reason = "Preserve imported AST-shape guards, including anonymous early-return fragments, without introducing a generic AST framework. See docs/adr-001-typescript-tooling.md#duplication-review."
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ishiban"]


# Reviewed spike families: see docs/developers-guide.md#duplication-review.

[[tool.duplication_gate.allow]]
members = ["ishiban/storage/projections.py::apply_observation", "ishiban/storage/projections.py::apply_catalogue"]
reason = "Keep independent persisted-observation and catalogue merge policies; only seed-or-copy scaffolding overlaps. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["src/ui/board-layout.tsx::span", "reference/ishiban-mockup.html::span"]
reason = "Keep labelled health and summary markup independent of the supplied static visual reference; wrapper tags contain different facts. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/test_storage_journal.py", "tests/test_storage_projection.py", "tests/test_activity_api.py"]
reason = "Keep explicit module imports and independent snapshot/replay boundary assertions visible in their tests; these fragments contain no shared calculation. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/storage_support.py::as_snapshot", "tests/storage_support.py::as_events", "tests/storage_support.py::as_detail"]
reason = "Preserve distinct static API contract casts; a generic cast wrapper would obscure the asserted snapshot, replay, or detail shape. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/api.py::__init__", "ishiban/activity_api.py::__init__", "ishiban/inspector_api.py::__init__", "ishiban/batch_activity_api.py::__init__", "ishiban/session_recency_api.py::__init__"]
reason = "Keep independent Falcon resource constructors explicit; inheritance solely for injected store assignment adds unrelated resource coupling. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/storage_support.py", "tests/test_observation_behaviour.py"]
reason = "Keep module dependency imports explicit; BDD runtime ownership and storage fixture implementations remain separate. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/storage/models.py", "migrations/versions/0001_initial_journal.py"]
reason = "Keep the initial schema and reverse-order drop declarations frozen independently of current storage models; migrations must not import evolving metadata. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/storage/session_events.py", "ishiban/storage/writer.py"]
reason = "Keep explicit module imports and calls to the shared finish_event primitive at distinct transaction boundaries; shared timestamp and field logic has been extracted. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_observation_behaviour.py"
reason = "Keep the two explicit protocol envelopes in the restart scenario: persisted completion and next-generation metadata have different evidence contracts. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/domain.py::Envelope", "ishiban/domain.py::CatalogueEntry", "ishiban/storage/journal_writer.py::JournalEvent"]
reason = "Keep inbound observation, catalogue enrichment and normalized journal event contracts independent; repeated typed fields do not share validation, requirements or version boundaries. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["src/ui/board-table.tsx::span", "reference/ishiban-mockup.html::span"]
reason = "Keep accessible session-list markup separate from supplied static reference markup; similar wrapper tags do not share interaction logic. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["src/ui/board-model.ts", "src/ui/board-table.tsx"]
reason = "Keep short activity/provenance guards and label/glyph mappings explicit; equal branch shapes return different meanings. Shared selection props have been extracted. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/test_storage_catalogue.py", "tests/test_storage_projection.py"]
reason = "Keep direct snapshot and replay assertions at their independent catalogue and generation boundaries; repeated reads verify observable contracts. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "migrations/env.py"
reason = "Keep Alembic offline and online configuration independent, including the transaction calls required by each connection mode. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/storage/store.py::snapshot", "ishiban/storage/store.py::current_cursor"]
reason = "Keep distinct public snapshot and cursor-only read contracts explicit; their initialization and transaction wrappers match, while shared SQL is already extracted into read_cursor. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/detail_pagination.py", "ishiban/storage/projections.py"]
reason = "The detector cannot name the anonymous two-line null guards in parse_turn_cursor and _turn_projection. Keep API first-page and stored-turn absence checks independent rather than add a cross-boundary helper. Review this exact file pair if future duplication expands. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_activity_api.py"
reason = "Keep unknown-activity journal immutability and known/missing-session eligibility assertions independently arranged; the shared fixture is already opened_store and their observations deliberately differ. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/agent-details.test.tsx"
reason = "Keep clipboard success and rejection assertions independent; both own and restore their spy, but verify different observable outcomes. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["src/ui/pull-request-titles.ts", "src/ui/agent-details.tsx"]
reason = "Keep title-map and agent-label trust boundaries independently decoded and scoped; only short HTTP identity guards overlap and the result schemas differ. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/test_lazy_activity.py", "tests/test_session_agent.py"]
reason = "Keep observer activity and session-show wire fixtures independent: they have different workspace envelopes, evidence fields and identity validation. Shared executable creation and call-log polling are extracted. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_lazy_activity.py"
reason = "Keep independent malformed-result caching, waiter cancellation and service shutdown scenarios explicit; only brief fake-command setup and read assertions overlap after process plumbing extraction. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_session_agent.py"
reason = "Keep missing or invalid configuration identities, failed configuration retries and unverified configuration envelopes separately asserted; identical partial labels have different cache and command-eligibility contracts. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_activity_cache.py"
reason = "Keep stale-write ordering and overlay eligibility scenarios independently arranged; they share cache lifecycle setup but prove different persistence contracts and assert different results. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["ishiban/storage/activity_cache.py::_require_initialized", "ishiban/storage/store.py::_require_initialized"]
reason = "Keep journal and sidecar lifecycle guards local to independently initialized engines; a common base solely for this guard would couple their ownership. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
members = ["tests/test_activity_api.py", "tests/test_activity_revision.py"]
reason = "Keep API eligibility and journal-watermark assertions at separate boundaries; explicit imports and observation setup overlap without a shared calculation. See docs/developers-guide.md#duplication-review."

[[tool.duplication_gate.allow]]
unit = "tests/test_activity_revision.py"
reason = "Keep initial absence, evidence advance and metadata/unknown preservation independently asserted; the common envelope and store fixtures are already shared. See docs/developers-guide.md#duplication-review."

